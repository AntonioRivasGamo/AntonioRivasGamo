<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Antonio Rivas - Backend Developer">
  <defs>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="0.5" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#7dcfff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 L0 0 0 30" fill="none" stroke="#7aa2f7" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bb9af7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
    .name { font-size: 58px; font-weight: 700; fill: url(#title); }
    .role { font-size: 18px; fill: #7dcfff; }
    .meta { font-size: 14px; fill: #565f89; }
    .tag  { font-size: 13px; fill: #9ece6a; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    .pulse { transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%,100% { opacity: .35; transform: scale(1);} 50% { opacity: 1; transform: scale(1.25);} }
    @keyframes float { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-8px);} }
    .float { animation: float 5s ease-in-out infinite; }
  </style>

  <rect width="900" height="280" rx="16" fill="#1a1b26"/>
  <rect width="900" height="280" rx="16" fill="url(#grid)"/>
  <circle cx="760" cy="120" r="180" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="899" height="279" rx="16" fill="none" stroke="#7aa2f7" stroke-opacity="0.35"/>

  <!-- Floating tags -->
  <g class="float">
    <rect x="690" y="40" width="88" height="28" rx="14" fill="#24283b" stroke="#9ece6a" stroke-opacity="0.5"/>
    <text x="734" y="59" text-anchor="middle" class="tag">Spring</text>
  </g>
  <g class="float" style="animation-delay:-1.5s">
    <rect x="782" y="92" width="92" height="28" rx="14" fill="#24283b" stroke="#7aa2f7" stroke-opacity="0.5"/>
    <text x="828" y="111" text-anchor="middle" class="tag" style="fill:#7aa2f7">Docker</text>
  </g>
  <g class="float" style="animation-delay:-3s">
    <rect x="700" y="148" width="104" height="28" rx="14" fill="#24283b" stroke="#bb9af7" stroke-opacity="0.5"/>
    <text x="752" y="167" text-anchor="middle" class="tag" style="fill:#bb9af7">Kubernetes</text>
  </g>

  <!-- Content -->
  <text x="56" y="110" class="meta">// hello, world</text>
  <text x="56" y="172" class="name">Antonio Rivas</text>
  <text x="56" y="210" class="role">&gt; Backend Developer<tspan class="blink">_</tspan></text>
  <text x="56" y="244" class="meta">Madrid, ES · Java · Spring Boot · Python · Linux</text>

  <!-- Status dot -->
  <circle cx="34" cy="34" r="5" fill="#9ece6a" class="pulse"/>
  <text x="48" y="39" class="meta">available for collaboration</text>
</svg>
